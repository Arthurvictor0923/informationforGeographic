          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M4.9 4.9a15 15 0 0 1 0 14.2"/><path d="M7.8 7.8a10 10 0 0 1 0 8.4"/><circle cx="12" cy="12" r="1.6"/><path d="M16.2 7.8a10 10 0 0 1 2.8 6.4"/><path d="M19.1 4.9a15 15 0 0 1 0 14.2"/></svg> 地图服务

        <a href="要素图层.html" data-module="layer" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 要素图层
        </a>
        <a href="专题地图.html" data-module="map" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">

        <a href="任务中心.html" data-module="task" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">

<!-- REGISTER SERVICE MODAL -->
<div id="registerServiceModal" class="fixed inset-0 z-50 hidden flex items-center justify-center" style="background: rgba(0,0,0,.45);">
  <div class="bg-white rounded-2xl shadow-2xl overflow-hidden fade-in" style="width: 640px;">
    <div class="px-6 py-4 border-b border-line flex items-center justify-between">
      <h2 class="text-base font-semibold text-gray-900"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg> 注册外部地图服务</h2>
      <button onclick="closeWizard('registerServiceModal')" class="text-gray-400 hover:text-gray-600 text-lg">✕</button>
    </div>
    <div class="p-6">
      <p class="text-gray-500 text-sm mb-5">选择你的服务来源——系统会自动帮你处理技术细节。</p>

      <!-- 入口 1：注册我的服务器 -->
      <div id="regSrcServer" onclick="selectRegisterSource('server')" class="border-2 border-gray-200 hover:border-brand hover:bg-brand-light rounded p-5 mb-4 cursor-pointer transition-all">
        <div class="flex items-center gap-4">
          <span class="text-3xl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>
          <div class="flex-1">
            <div class="font-semibold text-gray-800">注册我的服务器</div>
            <div class="text-xs text-gray-500 mt-1">输入服务器地址，系统自动探测服务类型（支持 ArcGIS / GeoServer / IServer）</div>
          </div>
          <span id="regRadioServer" class="w-5 h-5 rounded-full border-2 border-gray-300 flex-shrink-0"></span>
        </div>
      </div>

      <!-- 入口 2：使用在线底图 -->
      <div id="regSrcOnline" onclick="selectRegisterSource('online')" class="border-2 border-gray-200 hover:border-brand hover:bg-brand-light rounded p-5 mb-4 cursor-pointer transition-all">
        <div class="flex items-center gap-4">
          <span class="text-3xl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg></span>
          <div class="flex-1">
            <div class="font-semibold text-gray-800">使用在线底图</div>
            <div class="text-xs text-gray-500 mt-1">直接使用公共地图平台作为底图，无需自己部署服务器</div>
          </div>
          <span id="regRadioOnline" class="w-5 h-5 rounded-full border-2 border-gray-300 flex-shrink-0"></span>
        </div>
      </div>

      <!-- 详情：注册我的服务器 -->
      <div id="regServerDetail" class="hidden mt-1 bg-gray-50 border border-line rounded-lg p-4 space-y-3 fade-in">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">服务器地址 <span class="text-red-400">*</span></label>
          <div class="flex gap-2">
            <input id="regServerUrl" type="text" placeholder="例如：http://192.168.1.100:8080/geoserver" class="flex-1 px-3 py-2 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
            <button onclick="probeServer()" class="px-4 py-2 bg-white border border-line rounded-lg text-sm text-gray-600 hover:border-brand hover:text-brand-hover transition-colors flex-shrink-0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> 自动探测</button>
          </div>
        </div>
        <div id="regProbeResult" class="hidden flex items-center gap-3 bg-green-50 border border-green-200 rounded-lg p-3">
          <span class="text-green-500 text-lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg></span>
          <div>
            <div class="text-sm font-medium text-gray-800">已识别服务类型</div>
            <div class="text-xs text-green-700">WMS · 从你的服务器检测到 4 个可用服务</div>
          </div>
        </div>
      </div>

      <!-- 详情：使用在线底图 -->
      <div id="regOnlineDetail" class="hidden mt-1 bg-gray-50 border border-line rounded-lg p-4 space-y-3 fade-in">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">选择平台 <span class="text-red-400">*</span></label>
          <select id="regOnlineSelect" onchange="setRegNext(!!this.value)" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
            <option value="">请选择平台</option>
            <option value="tdt">天地图（权威底图，覆盖全国）</option>
            <option value="baidu">百度地图（适合城市区域展示）</option>
            <option value="amap">高德地图（适合城市区域展示）</option>
            <option value="cg">长光卫星（最新卫星影像）</option>
          </select>
          <p class="text-xs text-gray-400 mt-1.5">选择后系统自动完成注册配置，一般用户无需改动任何参数</p>
        </div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-line flex items-center justify-between bg-gray-50">
      <span class="text-xs text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg> 注册后可在「要素图层」中作为底图或叠加层使用</span>
      <div class="flex items-center gap-3">
        <button onclick="closeWizard('registerServiceModal')" class="px-4 py-1.5 text-gray-500 hover:text-gray-700 text-sm">取消</button>
        <button id="regNextBtn" onclick="finishRegister()" class="px-4 py-1.5 bg-brand hover:bg-brand-hover text-white rounded text-sm font-medium transition-colors" disabled style="opacity:.4;cursor:not-allowed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/></svg> 确认注册</button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
// ── 地图服务：注册外部服务 (白话入口) ─────────────────
let regSource = null;
let regProbed = false;

function selectRegisterSource(src) {
  regSource = src;
  const srv = document.getElementById('regSrcServer');
  const onl = document.getElementById('regSrcOnline');
  srv.className = 'border-2 rounded-lg p-5 mb-4 cursor-pointer transition-all flex items-center gap-4 ' + (src === 'server' ? 'border-brand bg-brand-light' : 'border-gray-200 hover:border-brand hover:bg-brand-light');
  onl.className = 'border-2 rounded-lg p-5 mb-4 cursor-pointer transition-all flex items-center gap-4 ' + (src === 'online' ? 'border-brand bg-brand-light' : 'border-gray-200 hover:border-brand hover:bg-brand-light');
  document.getElementById('regRadioServer').className = 'w-5 h-5 rounded-full flex-shrink-0 ' + (src === 'server' ? 'border-4 border-brand' : 'border-2 border-gray-300');
  document.getElementById('regRadioOnline').className = 'w-5 h-5 rounded-full flex-shrink-0 ' + (src === 'online' ? 'border-4 border-brand' : 'border-2 border-gray-300');
  document.getElementById('regServerDetail').classList.toggle('hidden', src !== 'server');
  document.getElementById('regOnlineDetail').classList.toggle('hidden', src !== 'online');
  if (src === 'server') setRegNext(regProbed);
  if (src === 'online') setRegNext(!!document.getElementById('regOnlineSelect').value);
}

function setRegNext(enabled) {
  const btn = document.getElementById('regNextBtn');
  btn.disabled = !enabled;
  btn.style.opacity = enabled ? '1' : '.4';
  btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
}

function probeServer() {
  const url = document.getElementById('regServerUrl').value.trim();
  if (!url) { showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '请输入服务器地址后再探测'); return; }
  regProbed = true;
  document.getElementById('regProbeResult').classList.remove('hidden');
  setRegNext(true);
  showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>', '已自动识别：WMS · 从你的服务器检测到 4 个可用服务');
}

function finishRegister() {
  const name = regSource === 'server'
    ? '注册的服务器服务'
    : (document.getElementById('regOnlineSelect').selectedOptions[0]?.text.split('（')[0] || '在线底图');
  closeWizard('registerServiceModal');
  // 重置弹窗状态
  regSource = null; regProbed = false;
  document.getElementById('regProbeResult').classList.add('hidden');
  document.getElementById('regServerUrl').value = '';
  document.getElementById('regOnlineSelect').value = '';
  setRegNext(false);
  showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>', '✅ 外部服务接入成功！下一步：把它加进一个<strong>图层组合</strong>，才能用于专题图。<button onclick="openEditorPrototype()" class="text-brand underline font-medium ml-2">去组合图层 →</button>');
}

// ── 地图服务：排序卡片 ─────────────────────────────────
function sortServiceCards(by) {
  const store = moduleConfigs.service;
  if (by === 'name') {
    store.cards.sort((a, b) => a.title.localeCompare(b.title, 'zh'));
  } else if (by === 'refs') {
    store.cards.sort((a, b) => (b.sub.match(/引用(\d+)/)?.[1]||0) - (a.sub.match(/引用(\d+)/)?.[1]||0));
  } else {
    // time: restore default order (by mine first, then as defined)
    store.cards.sort((a, b) => (b.mine ? 1 : 0) - (a.mine ? 1 : 0));
  }
  document.getElementById('mainContent').innerHTML = renderMain('service');
}

// ── 地图服务：时序版本切换 ─────────────────────────────
function switchServiceVersion(idx, tsi) {
  const card = moduleConfigs.service.cards[idx];
  if (!card || !card.timeSeries || !card.timeSeries[tsi]) return;
  card.tsActive = tsi;
  const ts = card.timeSeries[tsi];
  card.sub = ts.sub;
  document.getElementById('mainContent').innerHTML = renderMain(activeModule);
}

// ── 地图服务：详情内时序版本切换 ───────────────────────
function switchDetailVersion(tsi) {
  tsi = parseInt(tsi);
  if (!dtCard || !dtCard.timeSeries || !dtCard.timeSeries[tsi]) return;
  dtCard.tsActive = tsi;
  const ts = dtCard.timeSeries[tsi];
  dtCard.sub = ts.sub;
  // 同步更新 moduleConfigs 中的卡片
  const card = moduleConfigs.service.cards.find(c => c.title === dtCard.title);
  if (card) { card.tsActive = tsi; card.sub = ts.sub; }
  switchDetailTab(0);
}

// ── 地图服务：复制地址 ─────────────────────────────────
function copyServiceUrl(title) {
  const url = 'http://maps.hetu.example.com/service/' + encodeURIComponent(title);
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>', '服务地址已复制，可直接分享给同事使用<br><span class="text-xs text-gray-400">' + url + '</span>');
  } catch (e) {
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>', '服务地址：' + url);
  }
  document.body.removeChild(ta);
}

// ── 初始化 ─────────────────────────────────────────────
document.getElementById('appShell').classList.remove('hidden');
activeModule = 'service';
switchModule('service');
showWelcomeIfNeeded();
</script>
</body>
