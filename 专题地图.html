<script src="common.js"></script>
<script>
// ── 创建专题地图：初始要素图层选择器（选填）──────────────
// 数据源 = common.js 的 moduleConfigs.layer.cards（要素图层资产）
function createLayerCandidates() {
  return (typeof moduleConfigs !== 'undefined' && moduleConfigs.layer && moduleConfigs.layer.cards) ? moduleConfigs.layer.cards : [];
}
function cmEsc(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 渲染可勾选的要素图层列表（草稿/无表达层的图层禁选）
function renderCreateLayerPicker() {
  const box = document.getElementById('cmLayerList');
  if (!box) return;
  const cards = createLayerCandidates();
  if (!cards.length) { box.innerHTML = '<div class="px-3 py-4 text-xs text-gray-400 text-center">暂无可选要素图层</div>'; return; }
  box.innerHTML = cards.map(function (c, i) {
    const draft = !!c.empty || c.svcCount === 0;
    const kind = c.raster === 'sequence' ? '栅格时序' : (c.raster === 'single' ? '栅格单张' : '矢量');
    return '<label class="flex items-start gap-2.5 px-3 py-2 ' + (draft ? 'opacity-50' : 'hover:bg-brand/5 cursor-pointer') + '" data-lname="' + cmEsc(c.title) + '">' +
      '<input type="checkbox" class="mt-0.5 rounded border-line text-brand focus:ring-brand/30 w-3.5 h-3.5 cm-layer-cb" data-idx="' + i + '"' + (draft ? ' disabled' : '') + ' onchange="syncCreateLayerCount()">' +
      '<span class="flex-1 min-w-0">' +
        '<span class="block text-xs font-medium text-gray-800 truncate">' + cmEsc(c.title) + '</span>' +
        '<span class="block text-[10px] text-gray-400 truncate">' + cmEsc(c.sub) + '</span>' +
      '</span>' +
      '<span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500 flex-shrink-0">' + kind + '</span>' +
    '</label>';
  }).join('');
  syncCreateLayerCount();
}

// 展开 / 收起选择器
function toggleCreateLayerPicker() {
  const box = document.getElementById('cmLayerPicker');
  const arrow = document.getElementById('cmLayerArrow');
  if (!box) return;
  const open = !box.classList.toggle('hidden');
  if (arrow) arrow.style.transform = open ? 'rotate(180deg)' : '';
}

// 关键字过滤（按图层名 + 描述）
function filterCreateLayers(kw) {
  const q = (kw || '').trim().toLowerCase();
  document.querySelectorAll('#cmLayerList label').forEach(function (el) {
    const hay = ((el.getAttribute('data-lname') || '') + ' ' + (el.textContent || '')).toLowerCase();
    el.style.display = (!q || hay.indexOf(q) !== -1) ? '' : 'none';
  });
}

// 当前已勾选的要素图层名
function selectedCreateLayers() {
  const out = [];
  document.querySelectorAll('#cmLayerList .cm-layer-cb').forEach(function (cb) {
    if (!cb.checked) return;
    const c = createLayerCandidates()[parseInt(cb.getAttribute('data-idx'), 10)];
    if (c) out.push(c.title);
  });
  return out;
}

// 同步「已选 N」徽章
function syncCreateLayerCount() {
  const n = selectedCreateLayers().length;
  const el = document.getElementById('cmLayerCount');
  if (!el) return;
  el.textContent = '已选 ' + n;
  el.className = n
    ? 'text-[10px] bg-brand/10 text-brand rounded-full px-2 py-0.5 font-medium'
    : 'text-[10px] bg-gray-100 text-gray-500 rounded-full px-2 py-0.5 font-medium';
}

// 创建后复位选择器
function resetCreateLayers() {
  document.querySelectorAll('#cmLayerList .cm-layer-cb').forEach(function (cb) { cb.checked = false; });
  const kw = document.getElementById('cmLayerKw');
  if (kw) { kw.value = ''; filterCreateLayers(''); }
  syncCreateLayerCount();
  const box = document.getElementById('cmLayerPicker');
  if (box) box.classList.add('hidden');
  const arrow = document.getElementById('cmLayerArrow');
  if (arrow) arrow.style.transform = '';
}

// ── 专题地图：确认创建 ─────────────────────────────────
function confirmCreateMap() {
  const name = (document.getElementById('cmName').value || '').trim();
  if (!name) {
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '请先填写地图名称');
    return;
  }
  closeWizard('createMapModal');
  if (!notified.map) {
    notified.map = true;
  }
  const picks = selectedCreateLayers();
  showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m12 2 2.4 7.4H22l-6 4.3 2.3 7.3L12 16.7 5.7 21l2.3-7.3-6-4.3h7.6z"/></svg>', `✅ 专题地图「<strong>${name}</strong>」创建成功！${picks.length ? '已加入 ' + picks.length + ' 个要素图层（' + picks.join('、') + '）。' : ''}正在打开地图设计器…`);
  // 时序组件为默认能力，创建后即挂载（无勾选、不额外提示）
  setTimeout(() => {
    const tl = document.getElementById('mvTimeline');
    if (tl) { tl.classList.remove('hidden'); renderTimelineTicks(); }
  }, 600);
  openEditorPrototype();
  // 重置表单
  document.getElementById('cmName').value = '';
  document.getElementById('cmCode').value = '';
  document.getElementById('cmDesc').value = '';
  resetCreateLayers();
}

// ── 专题地图：编辑 / 设计 ──────────────────────────────
function openMapDesign(action, title) {
  if (action === 'edit') {
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>', '正在打开「' + title + '」的编辑配置（原型模拟）');
  } else {
    openMapViewer(title); // 设计 = 打开地图查看器
  }
}

// ── 初始化 ─────────────────────────────────────────────
document.getElementById('appShell').classList.remove('hidden');
activeModule = 'map';
switchModule('map');
// 创建弹窗内的「初始要素图层」选择器：初始渲染（数据源 = 要素图层资产）
