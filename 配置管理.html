<style>
/* 二级入口指向已有业务页面时的跳转链接 */
.ht-entered{margin-left:auto;display:inline-flex;align-items:center;height:28px;padding:0 12px;font-size:12px;color:var(--brand,#005653);background:var(--brand-light,#edf6f2);border-radius:4px;text-decoration:none;white-space:nowrap;transition:background .15s}
.ht-entered:hover{background:var(--brand,#005653);color:#fff}
/* MVT切片参数 Tab */
.ht-mvt-tabs{border-bottom:1px solid var(--border,#dce5e9)}
.ht-mvt-tab{height:38px;padding:0 14px;font-size:13px;color:var(--text-secondary,#526078);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s}
.ht-mvt-tab:hover{color:var(--brand,#005653)}
.ht-mvt-tab.active{color:var(--brand,#005653);border-bottom-color:var(--brand,#005653);font-weight:600}
.ht-mvt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ht-mvt-item{display:flex;flex-direction:column;gap:6px}
.ht-mvt-item label{font-size:13px;color:var(--text-secondary,#526078)}
.ht-mvt-item input{height:34px;padding:0 10px;font-size:13px;color:var(--text,#10213a);background:#fff;border:1px solid var(--border,#dce5e9);border-radius:4px;outline:none;transition:border-color .15s}
.ht-mvt-item input:focus{border-color:var(--brand,#005653)}
.ht-mvt-checks{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-light,#eaf0ee)}
.ht-mvt-checks label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary,#526078);cursor:pointer}
.ht-mvt-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.ht-mvt-preset{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;background:#fff;border:1px solid var(--border,#dce5e9);border-radius:6px;cursor:pointer;transition:border-color .15s,background .15s}
.ht-mvt-preset:hover{border-color:var(--brand,#005653)}
.ht-mvt-preset.active{border-color:var(--brand,#005653);background:var(--brand-light,#edf6f2)}
.ht-mvt-preset strong{font-size:14px;font-weight:600;color:var(--text,#10213a)}
.ht-mvt-preset span{font-size:12px;color:var(--text-muted,#6b778c)}
/* 处理分析：两类任务对照 */
.ht-task-split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ht-task-col{padding:14px 16px;background:var(--gray-50,#f5f8f7);border:1px solid var(--border-light,#eaf0ee);border-radius:6px}
.ht-task-col-title{font-size:13px;font-weight:600;color:var(--text,#10213a);margin-bottom:8px}
.ht-task-list{margin:0;padding-left:18px;font-size:13px;color:var(--text-secondary,#526078);line-height:1.9}
@media (max-width:900px){.ht-task-split{grid-template-columns:1fr}}
</style>

<div class="ht-module-layout"><div class="ht-module-content"><div class="ht-local-content"><section class="ht-sub-panel" data-sub="expr" hidden><h1 class="ht-page-heading">表达式</h1><div class="ht-empty-page"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="7" width="30" height="34" rx="4"/><path d="M17 17h14M17 24h14M17 31h9"/></svg><p>功能页面待接入</p></div></section><section class="ht-sub-panel" data-sub="mvt" hidden>

<script>
  // MVT切片参数：内部两个 Tab（切片参数｜常用参数组合）
  (function () {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.ht-mvt-tab'));
    var panels = Array.prototype.slice.call(document.querySelectorAll('.ht-mvt-panel'));
    var presets = Array.prototype.slice.call(document.querySelectorAll('.ht-mvt-preset'));
    function applyTab(name) {
      tabs.forEach(function (t) {
        var on = t.dataset.mvtTab === name;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', String(on));
      });
      panels.forEach(function (p) { p.hidden = p.dataset.mvtPanel !== name; });
    }
    tabs.forEach(function (t) {
      t.addEventListener('click', function () { applyTab(t.dataset.mvtTab); });
    });
    presets.forEach(function (p) {
      p.addEventListener('click', function () {
        presets.forEach(function (x) { x.classList.remove('active'); });
        p.classList.add('active');
      });
    });
  })();
  </script>
