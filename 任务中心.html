</head>
<body class="bg-page-bg text-gray-800 text-sm h-screen overflow-hidden flex flex-col">

<!-- ============================================================ -->
<!-- MAIN APP SHELL                                               -->
<!-- ============================================================ -->
<div id="appShell" class="h-full flex flex-col">

  <!-- HEADER -->
  <header class="h-16 flex items-center justify-between flex-shrink-0 z-30 px-5">
    <div class="flex items-center">
      <div class="flex items-center gap-2 mr-6">
        <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center text-white font-bold text-base">河</div>
        <span class="text-base font-semibold text-brand">河图·地理信息平台</span>
      </div>
      <nav id="topNav" class="flex items-center h-16 gap-0.5">
        <a href="数据资产.html" data-module="data" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg> 数据资产
        </a>
        <a href="地图服务-重设计.html" data-module="service" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M4.9 4.9a15 15 0 0 1 0 14.2"/><path d="M7.8 7.8a10 10 0 0 1 0 8.4"/><circle cx="12" cy="12" r="1.6"/><path d="M16.2 7.8a10 10 0 0 1 2.8 6.4"/><path d="M19.1 4.9a15 15 0 0 1 0 14.2"/></svg> 地图服务
        </a>
        <a href="要素图层.html" data-module="layer" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 要素图层
        </a>
        <a href="专题地图.html" data-module="map" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg> 专题地图
        </a>
        <a href="任务中心.html" data-module="task" class="nav-btn active px-3.5 h-16 text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg> 任务中心
          <span class="active-bar"></span>
        </a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <button id="emptyToggleBtn" onclick="toggleTaskEmptyState()" class="btn btn-sm btn-text" title="切换当前模块空状态 / 有数据，用于验证空状态引导设计"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> 空状态</button>
      <div class="w-8 h-8 rounded-full bg-[#f56a00] text-white flex items-center justify-center font-semibold text-sm">张</div>
      <span class="text-gray-700 text-sm">张建国</span>
      <span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded">业务人员</span>
    </div>
  </header>

  <!-- BODY -->
  <div class="flex-1 overflow-hidden p-3">
    <main id="taskMain" class="h-full bg-white border border-gray-100 rounded-xl shadow-sm overflow-hidden flex flex-col min-w-0"></main>
  </div>

<script src="common.js"></script>
<script>
// ── 任务中心：列表信息页（与四个模块页同一套工具栏 + 筛选面板 + 列表）──
let taskFilter = { status: '全部', type: '全部', kw: '', sort: 'time', order: 'desc' };
const TASK_PAGE_SIZE = 10;
let taskPage = 1;
let __taskEmptyPreview = false;

function matchTask(t) {
  if (taskFilter.status !== '全部') {
    if (taskFilter.status === 'processing') {
      if (t.status !== 'queued' && t.status !== 'running') return false;
    } else if (t.status !== taskFilter.status) {
      return false;
    }
  }
  if (taskFilter.type !== '全部' && t.type !== taskFilter.type) return false;
  if (taskFilter.kw) {
    const hay = (t.title + ' ' + (t.target || '')).toLowerCase();
    if (!hay.includes(taskFilter.kw.toLowerCase())) return false;
  }
  return true;
}

function setTaskStatusFilter(v) { taskFilter.status = v; taskPage = 1; renderTaskCenter(); }
function setTaskTypeFilter(v) { taskFilter.type = v; taskPage = 1; renderTaskCenter(); }
function setTaskSort(v) { taskFilter.sort = v; taskPage = 1; renderTaskCenter(); }
function toggleTaskOrder() { taskFilter.order = taskFilter.order === 'asc' ? 'desc' : 'asc'; taskPage = 1; renderTaskCenter(); }

// 排序：与「筛选」平级的分段控件（非下拉框）+ 升/降序切换
function taskSortControlHTML() {
  const opts = [
    { key: 'time', label: '时间' },
    { key: 'status', label: '状态' },
    { key: 'name', label: '名称' },
  ];
  const seg = '<div class="inline-flex items-center bg-gray-100 rounded-lg p-0.5">'
    + opts.map(o => '<button onclick="setTaskSort(\'' + o.key + '\')" class="btn btn-sm ' + (taskFilter.sort === o.key ? 'btn-primary' : 'btn-text') + '">' + o.label + '</button>').join('')
    + '</div>';
  const desc = taskFilter.order !== 'asc';
  const arrow = desc
    ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6h18"/><path d="M12 9v12m0 0-5-5m5 5 5-5"/></svg>'
    : '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 18h18"/><path d="M12 15V3m0 0-5 5m5-5 5 5"/></svg>';
  return seg
    + '<button onclick="toggleTaskOrder()" title="' + (desc ? '当前降序，点击切换为升序' : '当前升序，点击切换为降序') + '" class="btn btn-icon btn-sm btn-default">' + arrow + '</button>';
}
function setTaskKeyword(v) {
  taskFilter.kw = v;
  taskPage = 1;
  const el = document.getElementById('taskSearch');
  const pos = el ? el.selectionStart : null;
  renderTaskCenter();
  const n = document.getElementById('taskSearch');
  if (n && pos !== null) { n.focus(); n.setSelectionRange(pos, pos); }
}

// 顶部统计（对齐真实系统：白色浮层卡片 + 左侧彩色图标块 + 右侧标题/数字/副标题；6 张自适应网格）
function taskStatsHTML() {
  const all = getTasks();
  const total = all.length;
  const running = all.filter(t => t.status === 'running').length;
  const queued = all.filter(t => t.status === 'queued').length;
  const success = all.filter(t => t.status === 'success').length;
  const failed = all.filter(t => t.status === 'failed').length;
  // 派生指标（演示用静态展示，真实计算见 derive 注释）
  const active = running + queued;
  const activePct = total ? Math.round(active / total * 100) : 0;
  const successRate = total ? Math.round(success / total * 100) : 0;

  // 单卡：左侧 48×48 圆角色块（白色 SVG 图标）+ 右侧三行（标签/大数字/副标题）
  // 颜色类为 common.css 新增 .stat-icon-*；图标 inline SVG（与全站风格一致，无 emoji）
  const card = (label, num, sub, subColor, icon, iconBg) =>
    '<div class="flex-1 min-w-0 flex items-center gap-3 bg-white border border-line rounded-xl px-4 py-3.5 shadow-sm transition-all hover:shadow-md hover:-translate-y-px">'
    + '<div class="w-12 h-12 rounded-xl flex items-center justify-center flex-shrink-0 ' + iconBg + '">'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px;color:#fff">' + icon + '</svg>'
    + '</div>'
    + '<div class="flex flex-col gap-1 min-w-0 flex-1">'
    + '<div class="text-xs text-gray-400">' + label + '</div>'
    + '<div class="text-2xl font-semibold leading-none text-gray-800 tabular-nums">' + num + '</div>'
    + (sub ? '<div class="text-[11px] ' + subColor + ' truncate">' + sub + '</div>' : '')
    + '</div>'
    + '</div>';

  const icoList     = '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>';
  const icoBeat     = '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>';
  const icoCheck    = '<polyline points="20 6 9 17 4 12"/>';
  const icoAlert    = '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>';

  // 横向一行（flex + flex-1，绝不分多行堆叠）；仅 4 张有真实语义的卡：总数/进行中/今日完成/失败
  // （无"排队等待""平均耗时"概念，已移除）
  return '<div class="flex gap-4">'
    + card('任务总数',   total,                              '较昨日 +5',     'text-gray-400',  icoList,  'stat-icon-blue')
    + card('进行中',     active,                             '占总数 ' + activePct + '%',  'text-brand-dark', icoBeat,  'stat-icon-brand')
    + card('今日完成',   success,                            '成功率 ' + successRate + '%', 'text-green-600', icoCheck, 'stat-icon-green')
    + card('失败',       failed,                             failed ? '需立即处理' : '运行良好',     'text-red-500', icoAlert, 'stat-icon-red')
    + '</div>';
}

// 状态列：仅显示状态标签（不展示进度条）；失败额外展示原因
function taskStatusCell(t) {
  if (t.status === 'failed') {
    return taskStatusChip('failed')
      + '<div class="text-[11px] text-red-400 mt-0.5 truncate" title="' + (t.reason || '') + '">' + (t.reason || '处理过程中发生未知错误') + '</div>';
  }
  return taskStatusChip(t.status);
}

function taskCenterRowHTML(t) {
  const typeChip = t.type === 'data'
    ? '<span class="px-2 py-0.5 rounded bg-blue-50 text-blue-600 text-[11px] font-medium">入库</span>'
    : '<span class="px-2 py-0.5 rounded bg-brand-light text-brand-dark text-[11px] font-medium">发布</span>';
  const actions =
    '<div class="flex items-center justify-end gap-2">'
    + '<button onclick="viewTaskLog(\'' + t.id + '\')" class="btn btn-sm btn-default">日志</button>'
    + (t.status === 'failed' ? '<button onclick="retryTask(\'' + t.id + '\')" class="btn btn-sm btn-primary">重试</button>' : '')
    + (t.status === 'success' ? '<button onclick="jumpTaskResult(\'' + t.id + '\')" class="btn btn-sm btn-primary">查看结果</button>' : '')
    + '</div>';
  // 起止时间：createdAt ~ 最后一步结束时间（无则显示进行中/排队）
  const steps = t.steps || [];
  const lastEnd = steps.length ? (steps[steps.length - 1].endAt || '') : '';
  const endText = t.status === 'success' || t.status === 'failed' ? (lastEnd || '—') : (t.status === 'running' ? '处理中' : '排队中');
  return '<tr class="border-t border-gray-100 hover:bg-gray-50 transition-colors">'
    + '<td class="px-4 py-3"><div class="flex items-center gap-2">' + typeChip + '<span class="text-sm font-medium text-gray-800">' + t.title + '</span></div></td>'
    + '<td class="px-4 py-3 text-xs text-gray-500 truncate max-w-[140px]" title="' + (t.target || '') + '">' + (t.target || '—') + '</td>'
    + '<td class="px-4 py-3">' + taskStatusCell(t) + '</td>'
    + '<td class="px-4 py-3 text-xs text-gray-500">' + (t.operator || '张建国') + '</td>'
    + '<td class="px-4 py-3 text-xs text-gray-400 whitespace-nowrap">' + t.createdAt + ' → ' + endText + '</td>'
    + '<td class="px-4 py-3">' + actions + '</td>'
    + '</tr>';
}

function sortTasks(list) {
  const arr = list.slice();
  const dir = taskFilter.order === 'asc' ? 1 : -1;
  if (taskFilter.sort === 'name') {
    return arr.sort((a, b) => dir * a.title.localeCompare(b.title, 'zh'));
  }
  if (taskFilter.sort === 'status') {
    const order = { running: 0, queued: 1, failed: 2, success: 3 };
    return arr.sort((a, b) => dir * ((order[a.status] ?? 4) - (order[b.status] ?? 4)));
  }
  // 提交时间：desc 最新在前，asc 最早在前
  return arr.sort((a, b) => dir * (a.createdAt || '').localeCompare(b.createdAt || ''));
}

function renderTaskList() {
  const all = sortTasks(getTasks().filter(matchTask));
  const total = all.length;
  const totalPages = Math.max(1, Math.ceil(total / TASK_PAGE_SIZE));
  taskPage = Math.min(Math.max(1, taskPage), totalPages);
  const pageItems = all.slice((taskPage - 1) * TASK_PAGE_SIZE, taskPage * TASK_PAGE_SIZE);
  const el = document.getElementById('taskList');
  if (!el) return;
  const cnt = document.getElementById('taskCount');
  if (cnt) cnt.textContent = '共 ' + total + ' 条';
  if (!total) {
    el.innerHTML = '<tr><td colspan="6" class="px-4 py-16 text-center text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:2.5em;height:2.5em;margin:0 auto;display:block"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><div class="mt-2">暂无任务</div></td></tr>';
  } else {
    el.innerHTML = pageItems.map(taskCenterRowHTML).join('');
  }
  const pg = document.getElementById('taskPager');
  if (pg) pg.innerHTML = renderTaskPager(total, totalPages, taskPage);
}

function setTaskPage(p) {
  taskPage = p;
  renderTaskList();
}

function renderTaskPager(total, totalPages, cur) {
  // 2026-08-31 统一分页：始终渲染（即使仅 1 页）+ 右下角右对齐
  const nums = [];
  const push = p => { if (!nums.includes(p)) nums.push(p); };
  push(1);
  for (let p = cur - 2; p <= cur + 2; p++) if (p >= 1 && p <= totalPages) push(p);
  push(totalPages);
  nums.sort((a, b) => a - b);
  let pages = '';
  let prev = 0;
  nums.forEach(p => {
    if (p - prev > 1) pages += '<span class="px-1 text-gray-300 text-sm">…</span>';
    pages += '<button onclick="setTaskPage(' + p + ')" class="px-2 text-sm ' + (p === cur ? 'text-brand font-semibold' : 'text-gray-500 hover:text-gray-800') + ' transition-colors">' + p + '</button>';
    prev = p;
  });
  const dis = 'disabled:opacity-40 disabled:cursor-not-allowed';
  return '<div class="flex items-center justify-end px-4 py-3 border-t border-gray-100 gap-4">'
    + '<span class="text-xs text-gray-400">共 ' + total + ' 条 · 第 ' + cur + ' / ' + totalPages + ' 页</span>'
    + '<div class="flex items-center gap-1">'
    + '<button onclick="setTaskPage(' + (cur - 1) + ')" ' + (cur === 1 ? 'disabled' : '') + ' class="px-2 text-sm text-gray-500 hover:text-gray-800 transition-colors ' + dis + '">上一页</button>'
    + pages
    + '<button onclick="setTaskPage(' + (cur + 1) + ')" ' + (cur === totalPages ? 'disabled' : '') + ' class="px-2 text-sm text-gray-500 hover:text-gray-800 transition-colors ' + dis + '">下一页</button>'
    + '</div></div>';
}

function renderTaskCenter() {
  const all = getTasks().filter(matchTask);
  const showEmpty = all.length === 0 || __taskEmptyPreview;
  const chevron = '<svg class="filter-chev" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M3.52861 5.52876C3.78896 5.26841 4.21107 5.26841 4.47141 5.52876L8.00001 9.05735L11.5286 5.52876C11.789 5.26841 12.2111 5.26841 12.4714 5.52876C12.7318 5.78911 12.7318 6.21122 12.4714 6.47157L8.47141 10.4716C8.21107 10.7319 7.78896 10.7319 7.52861 10.4716L3.52861 6.47157C3.26826 6.21122 3.26826 5.78911 3.52861 5.52876Z" fill="currentColor" fill-opacity="0.88"/></svg>';
  document.getElementById('taskMain').innerHTML =
    '<div class="flex-1 flex flex-col min-h-0">'
    + '<div class="px-6 pt-6 pb-4 flex items-center justify-between flex-shrink-0">'
    + '<div class="flex items-center gap-3">'
    + '<h1 class="text-lg font-bold text-gray-900">任务中心</h1>'
    + '<span class="text-xs text-muted bg-gray-100 px-2.5 py-1 rounded-full font-medium">我的任务</span>'
    + '<span class="text-xs text-gray-400" id="taskCount">共 ' + (showEmpty ? 0 : all.length) + ' 条</span>'
    + '</div>'
    + '<div class="flex items-center gap-3">'
    + '<div class="relative">'
    + '<svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>'
    + '<input id="taskSearch" type="text" placeholder="搜索任务名称" value="' + taskFilter.kw + '" oninput="setTaskKeyword(this.value)" class="pl-9 pr-3 py-2 bg-white border border-line rounded-lg text-sm w-60 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand/20">'
    + '</div>'
    + '<div class="flex items-center gap-2">'
    + '<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4 4 4m6 4v12m0 0 4-4m-4 4-4-4"/></svg>'
    + taskSortControlHTML()
    + '</div>'
    + '<button id="filterToggle" onclick="toggleFilterPanel()" class="filter-swtich ' + (filterOpen ? 'filter-swtich-active' : '') + '" title="筛选"><span>筛选</span>' + chevron + '</button>'
    + '</div>'
    + '</div>'
    + '<div id="filterPanel" class="px-6 flex-shrink-0 ' + (filterOpen ? '' : 'hidden') + '">'
    + '<div class="flex flex-wrap items-center gap-x-4 gap-y-2 pb-4 border-b border-gray-100">'
    + '<select onchange="setTaskStatusFilter(this.value)" class="filter-select"><option value="全部" ' + (taskFilter.status === '全部' ? 'selected' : '') + '>全部状态</option><option value="processing" ' + (taskFilter.status === 'processing' ? 'selected' : '') + '>处理中</option><option value="success" ' + (taskFilter.status === 'success' ? 'selected' : '') + '>成功</option><option value="failed" ' + (taskFilter.status === 'failed' ? 'selected' : '') + '>失败</option></select>'
    + '<select onchange="setTaskTypeFilter(this.value)" class="filter-select"><option value="全部" ' + (taskFilter.type === '全部' ? 'selected' : '') + '>全部类型</option><option value="data" ' + (taskFilter.type === 'data' ? 'selected' : '') + '>入库</option><option value="service" ' + (taskFilter.type === 'service' ? 'selected' : '') + '>发布</option></select>'
    + '</div>'
    + '</div>'
    + '<div class="px-6 pb-3 flex-shrink-0">' + taskStatsHTML() + '</div>'
    + '<div class="flex-1 flex flex-col min-h-0 px-6 pb-6">'
    + (showEmpty
        ? '<div class="bg-white border border-line rounded-xl overflow-hidden py-8">' + emptyTaskCardHTML() + '</div>'
        : '<div class="flex-1 min-h-0 flex flex-col bg-white border border-line rounded-xl overflow-hidden">'
          + '<div class="flex-1 min-h-0 overflow-y-auto scroll-thin">'
          + '<table class="w-full text-sm">'
          + '<thead><tr class="text-gray-500 text-xs">'
          + '<th class="text-left px-4 py-3 font-medium bg-gray-50">任务名称</th>'
          + '<th class="text-left px-4 py-3 font-medium bg-gray-50">对应数据</th>'
          + '<th class="text-left px-4 py-3 font-medium bg-gray-50 w-52">状态</th>'
          + '<th class="text-left px-4 py-3 font-medium bg-gray-50">操作人</th>'
          + '<th class="text-left px-4 py-3 font-medium bg-gray-50">起止时间</th>'
          + '<th class="text-right px-4 py-3 font-medium bg-gray-50">操作</th>'
          + '</tr></thead>'
          + '<tbody id="taskList"></tbody>'
          + '</table>'
          + '</div>'
          + '<div id="taskPager" class="flex-shrink-0"></div>'
          + '</div>')
    + '</div>'
    + '</div>';
  if (!showEmpty) renderTaskList();
}

function emptyTaskCardHTML() {
  return ''
    + '<div class="text-center py-16">'
    + '<div class="w-20 h-20 mx-auto mb-5 rounded-2xl bg-brand-light flex items-center justify-center text-4xl text-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></div>'
    + '<div class="text-gray-800 font-semibold text-base mb-2">还没有任务</div>'
    + '<div class="text-gray-500 text-sm mb-6 max-w-md mx-auto leading-relaxed">数据入库、服务发布都是后台异步任务。上传数据或发布服务后，任务会自动出现在这里——可随时查看进度、重试失败任务、跳转到产物。</div>'
    + '<button onclick="goModule(\'data\')" class="btn btn-md btn-primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 去上传数据</button>'
    + '</div>';
}
function toggleTaskEmptyState() {
  __taskEmptyPreview = !__taskEmptyPreview;
  const b = document.getElementById('emptyToggleBtn');
  if (b) b.innerHTML = __taskEmptyPreview
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg> 有数据'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> 空状态';
  renderTaskCenter();
}

// ── 初始化 ─────────────────────────────────────────────
renderTaskCenter();
</script>
