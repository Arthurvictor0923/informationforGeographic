<script>
function serviceArt(type){const teal='#28b5a1',line='#657d78';let drawing='';
 if(type==='WFS')drawing='<path d="M35 18h84l26 27v100H35z" fill="#f1f5f4"/><path d="M119 18v27h26" fill="none" stroke="'+line+'"/><g stroke="#cedad7">'+[63,83,103,123].map(y=>'<path d="M49 '+y+'h82"/>').join('')+'<path d="M75 58v75M105 58v75"/></g><circle cx="56" cy="69" r="4" fill="'+teal+'"/><circle cx="56" cy="90" r="4" fill="'+teal+'"/>';
 else if(type==='WMTS')drawing=[0,1,2].map((r)=>[0,1,2].map(c=>'<rect x="'+(28+c*43+r*6)+'" y="'+(20+r*43)+'" width="37" height="37" rx="2" fill="'+['#39786e','#69a69b','#afd5ce'][r]+'" stroke="white"/>').join('')).join('');
 else if(type==='WMS')drawing='<path d="M20 48l47-21 49 19 46-20v105l-46 21-49-21-47 20z" fill="#e8f2ee" stroke="'+line+'"/><path d="M67 27v104M116 46v106" stroke="#a1bab2"/><path d="M20 107l36-45 38 37 34-47 34 47" fill="none" stroke="'+teal+'" stroke-width="10" opacity=".5"/>';
 else drawing='<rect x="22" y="20" width="138" height="132" rx="3" fill="#f7f9f8" stroke="#829a92"/><path d="M68 20v132M114 20v132M22 64h138M22 108h138" stroke="#abbdb6"/><path d="M34 42l25-8 13 29-26 21zM84 88l39-18 23 21-16 45-40-5z" fill="#b2c4b8" stroke="#69877c"/><path d="M30 128c22-31 38-5 66-33s48-28 55-48" fill="none" stroke="'+teal+'" stroke-width="5"/><circle cx="86" cy="42" r="5" fill="'+teal+'"/>';
 return '<svg viewBox="0 0 184 172" aria-hidden="true">'+drawing+'</svg>';
}
function sourceArt(kind){return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="51" r="38" fill="#f0f3f8"/>'+(kind==='GeoServer'?'<g fill="white" stroke="#d4dbe1"><rect x="24" y="24" width="54" height="17" rx="3"/><rect x="24" y="44" width="54" height="17" rx="3"/><rect x="24" y="64" width="54" height="17" rx="3"/></g><path d="M34 29v7M39 29v7M34 49v7M39 49v7M34 69v7M39 69v7" stroke="#28b5a1" stroke-width="3"/>':'<path d="M30 14h34l16 17v52H30z" fill="white" stroke="#d4dbe1" stroke-width="2"/><path d="M64 14v19h16" fill="#28b5a1"/><path d="M39 43h30M39 52h30M39 61h25" stroke="#d5dbe2" stroke-width="3"/><path d="M22 84V65h8v19M36 84V53h8v31" fill="#28b5a1" opacity=".8"/>')+'</svg>';}

'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA='行政村居民点', ORG='北大荒农垦集团有限公司（86）', CATALOG='基础地理信息数据';
// Fixtures are only review examples, not parsed production metadata.
const FIELD_DEFS=[{name:'fid',alias:'要素编号',primaryKey:true},{name:'id',alias:'',primaryKey:false},{name:'probability',alias:'概率',primaryKey:false}];
const TYPES={WMS:['Web地图服务','将数据渲染成地图图片，用于地图叠加和浏览。'],WMTS:['栅格瓦片服务','以图片瓦片加载地图，适合固定样式的地图浏览。'],WFS:['Web要素服务','获取空间要素及属性数据，用于查询和系统对接。'],MVT:['矢量瓦片服务','将矢量数据预先切片，客户端可设置颜色、标注和样式。'],REAL_MVT:['实时矢量瓦片服务','按请求生成矢量瓦片，展示数据更新后的内容。']};
const STRATEGIES=['单机常规切片','单机属性唯一值分组切片','单机均匀分组切片','单机聚类','单机属性唯一值分片聚类','蜂窝图'];
const GRIDS=['CGCS2000','WGS84','Web Mercator'];
const CRS=['WGS84（EPSG:4326）','CGCS2000（EPSG:4490）','Web Mercator（EPSG:3857）','北京54（EPSG:4214）','西安80（EPSG:4610）','其他'];
const PARAMS=[['minZoom','切片最小层级','5'],['maxZoom','切片最大层级','15'],['dropRate','按比例丢弃点','1'],['baseZoom','设置基准缩放级别','15'],['clusterDistance','指定聚类距离','40'],['maxBytes','控制瓦片字节大小','']];
const PRESETS={system:{name:'系统默认',desc:'沿用当前服务的默认参数',params:{}},zoom:{name:'常用层级',desc:'最小 5 级 · 最大 15 级',params:{minZoom:'5',maxZoom:'15'}},point:{name:'点聚合',desc:'5–15 级 · 聚类距离 40 像素',params:{minZoom:'5',maxZoom:'15',clusterDistance:'40'},cluster:true}};
const PROVIDERS=[['ArcGIS','ArcGIS 服务','ArcGIS Server Web'],['GeoServer','GeoServer 服务','GeoServer Web'],['iServer','iServer 服务','IServer Web'],['internet','互联网地图服务','XYZ、WMTS 等瓦片服务']];
const REG_TYPES=[...Object.entries(TYPES).map(([k,[n]])=>[k,n+'（'+k+'）']),['XYZ','栅格瓦片服务（XYZ）'],['ArcGIS_REST','ArcGIS REST 服务'],['ISERVER_REST','iServer REST 服务']];
const METHODS={file:['上传文件','Excel 表格 / 卫星影像 / 地理数据文件 / 压缩包，可多选。'],draw:['在线绘制','从文件上传创建，或手动设置点、线、面及属性字段。'],db:['从数据库导入','选择数据源，检索并勾选表或视图，可多选。']};
const TABLES=[['agri_v2_res_plot','表 · 耕地地块'],['crop_plot_2025','表 · 作物地块'],['二龙山农场_2026','视图 · 农场'],['erlongshan_field_poly','表 · 地块面']];
const TAGS=['耕地','遥感','水利','农机','畜牧'];
let serial=0;
const identifier=prefix=>prefix+'_'+Date.now().toString(36)+'_'+(++serial);
function freshParams(){return Object.fromEntries(PARAMS.map(([k,,v])=>[k,{enabled:false,value:v}]));}
function pubInit(example='normal'){
 const defs=FIELD_DEFS.map(f=>({...f,primaryKey:example==='noKey'?false:f.primaryKey,alias:example==='noAlias'?'':f.alias}));
 const keys=defs.filter(f=>f.primaryKey).map(f=>f.name);
 return {step:1,type:'MVT',example,defs,typeEdited:false,meta:{name:DATA,org:ORG,catalog:CATALOG,description:'',tags:'',identifier:identifier('srv'),crs:'WGS84（EPSG:4326）',purpose:'业务',filter:'',subset:'',bbox:''},mvt:{strategy:STRATEGIES[0],fields:keys,grid:'Web Mercator',preset:'system',params:freshParams(),dropDense:false,mergeDense:false,cluster:false,boundary:false,label:false},real:{fields:[],grid:'Web Mercator'},wmts:{format:'PNG',grids:['Web Mercator']},opened:{},errors:{},busy:false,receipt:null,cover:''};
}
function uploadInit(){return {step:1,method:'file',files:[],drawFiles:[],draw:{mode:'file',geom:'点',fields:[{name:'名称',type:'文本'},{name:'面积',type:'数值'}]},db:{source:'',search:'',tables:[]},parseHistogram:true,meta:{name:'',org:ORG,catalog:CATALOG,crs:'',crsOther:'',description:'',tags:[],dataset:''},nameEdited:false,opened:{},errors:{},busy:false,receipt:null};}
function registerInit(){return {provider:'GeoServer',url:'',type:'',name:'',scope:'内部系统',scopeEdited:false,purpose:'业务',description:'',opened:{},errors:{},busy:false,receipt:null};}
let publish=pubInit(),upload=uploadInit(),register=registerInit(),mode='publish',closed=false,notesVisible=window.innerWidth>930;
const current=()=>mode==='publish'?publish:mode==='upload'?upload:register;
const getPath=(o,p)=>p.split('.').reduce((v,k)=>v?.[k],o);
function setPath(o,p,v){const a=p.split('.'),k=a.pop();a.reduce((v,k)=>v[k],o)[k]=v;}
function input(path,id,placeholder='',type='text',extra=''){return '<input class="control" id="'+id+'" data-bind="'+path+'" value="'+esc(getPath(current(),path))+'" type="'+type+'" placeholder="'+esc(placeholder)+'" '+extra+'>';}
function area(path,id,placeholder=''){return '<textarea class="control" id="'+id+'" data-bind="'+path+'" placeholder="'+esc(placeholder)+'">'+esc(getPath(current(),path))+'</textarea>';}
function select(path,id,options,placeholder=''){const v=getPath(current(),path);return '<select class="control" id="'+id+'" data-bind="'+path+'">'+(placeholder?'<option value="">'+esc(placeholder)+'</option>':'')+options.map(o=>{const k=Array.isArray(o)?o[0]:o,n=Array.isArray(o)?o[1]:o;return '<option value="'+esc(k)+'"'+(v===k?' selected':'')+'>'+esc(n)+'</option>';}).join('')+'</select>';}
function field(id,label,control,required=false,mark='',help=''){const error=current().errors[id];return '<div class="field'+(mark?' review-mark':'')+(error?' invalid':'')+'" id="field-'+id+'"'+(mark?' data-mark="'+mark+'"':'')+'><label for="'+id+'">'+label+(required?'<span class="required">*</span>':'')+'</label>'+control+(help?'<p class="help">'+help+'</p>':'')+'<div class="error" id="error-'+id+'" role="alert">'+esc(error||'')+'</div></div>';}
function fold(key,title,body,hint='',mark=''){return '<details class="fold'+(mark?' review-mark':'')+'" data-fold="'+key+'"'+(mark?' data-mark="'+mark+'"':'')+(current().opened[key]?' open':'')+'><summary>'+title+(hint?'<span class="muted">'+hint+'</span>':'')+'</summary><div class="fold-body">'+body+'</div></details>';}
function check(path,label){return '<label><input type="checkbox" data-bind="'+path+'"'+(getPath(current(),path)?' checked':'')+'>'+label+'</label>';}
function steps(n,labels){return '<div class="steps" aria-label="步骤 '+n+' / '+labels.length+'">'+labels.map((t,i)=>(i?'<span class="connector"></span>':'')+'<span class="step '+(n===i+1?'on':n>i+1?'done':'')+'"><i>'+(n>i+1?'✓':i+1)+'</i>'+t+'</span>').join('')+'</div>';}
function shell(title,body,footer,stepLabels){return '<div class="product-head"><h2>'+title+'</h2>'+(stepLabels?steps(current().step,stepLabels):'')+'<button class="close" aria-label="关闭'+title+'" onclick="closePanel()">×</button></div><div class="product-body"><div class="content">'+body+'</div></div><div class="product-foot">'+footer+'</div>';}
function button(label,handler,primary=false,extra=''){return '<button class="btn'+(primary?' primary':'')+'" onclick="'+handler+'" '+extra+'>'+label+'</button>';}
function saveFolds(){document.querySelectorAll('[data-fold]').forEach(e=>current().opened[e.dataset.fold]=e.open);}
function render(resetScroll=false){
 const old=$('canvas').querySelector('.product-body')?.scrollTop||0;
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 $('canvas').innerHTML=closed?launcher():current().receipt?receiptView():mode==='publish'?publishView():mode==='upload'?uploadView():registerView();
 renderNotes();
 document.querySelectorAll('[data-fold]').forEach(e=>e.addEventListener('toggle',()=>{if(e.isConnected)current().opened[e.dataset.fold]=e.open;}));
 const body=$('canvas').querySelector('.product-body');if(body)body.scrollTop=resetScroll?0:old;
 syncNotes();
}
function openMode(next){saveFolds();mode=next;closed=false;render(true);}
function toggleNotes(){notesVisible=!notesVisible;syncNotes();}
function syncNotes(){$('notes').hidden=!notesVisible;document.body.classList.toggle('show-notes',notesVisible);$('notesToggle').textContent=notesVisible?'收起改动说明':'查看改动说明';$('notesToggle').setAttribute('aria-pressed',String(notesVisible));}
function resetCurrent(){if(current().busy)return;if(mode==='publish')publish=pubInit();else if(mode==='upload')upload=uploadInit();else register=registerInit();closed=false;render(true);}
function closePanel(){if(current().busy)return;saveFolds();closed=true;render(true);}
function launcher(){return '<div class="product-body"><div class="launch"><h2>查看优化后的操作</h2><p>选择入口继续体验，已填写内容会保留。</p>'+button('发布服务',"openMode('publish')",true)+button('注册服务',"openMode('register')")+button('添加数据',"openMode('upload')")+'</div></div>';}

function publishView(){const p=publish;return shell('发布服务',p.step===1?publishStep1():publishStep2(),(p.step===1?button('取消','closePanel()'):button('上一步','pubBack()',false,p.busy?'disabled':''))+button(p.busy?'<span class="spinner"></span>正在提交…':p.step===1?'下一步':'发布服务',p.step===1?'pubNext()':'submitPublish()',true,p.busy?'disabled':''),['选择服务与参数','填写服务信息']);}
function publishStep1(){
 const p=publish;
 let options='';
 if(p.type==='MVT'){
  options=field('strategy','执行策略',select('mvt.strategy','strategy',STRATEGIES),true,'','默认使用现有的单机常规切片，可按需要修改。')+
   field('fields','输出字段',fieldPicker('mvt'),true,'2',p.defs.some(f=>f.primaryKey)?'已默认勾选主键；标注、筛选或属性展示用到的字段请一并选择。':'数据元信息未提供主键，请手动选择需要输出的字段。')+
   field('grid','切片网格',select('mvt.grid','grid',GRIDS),true)+
   fold('params','切片参数',paramsView(),PRESETS[p.mvt.preset]?.name||'自定义','3')+
   '<div class="checks" style="margin-top:18px">'+check('mvt.boundary','创建边界切片')+check('mvt.label','创建标注切片')+'</div>';
 }else if(p.type==='REAL_MVT'){
  options=field('fields','输出字段',fieldPicker('real'),true,'','勾选需要用于标注、筛选或属性展示的字段。')+field('grid','切片网格',select('real.grid','grid',GRIDS),true);
 }else if(p.type==='WMTS'){
  options=field('format','瓦片格式',select('wmts.format','format',['PNG','JPEG']),true)+field('wmtsGrid','切片网格','<div class="checks">'+GRIDS.map(g=>'<label><input type="checkbox" '+(p.wmts.grids.includes(g)?'checked ':'')+'onchange="toggleGrid(\''+g+'\',this.checked)">'+g+'</label>').join('')+'</div>',true);
 }
 return '<div class="source-line"><span>发布数据</span><strong>'+DATA+'</strong><span class="source-kind">矢量 · 点 · EPSG:4326</span></div><h3 class="section-title">选择服务类型</h3><div class="field review-mark" data-mark="1"><div class="service-cards">'+Object.entries(TYPES).map(([k,[n]])=>'<button class="service-card'+(p.type===k?' selected':'')+'" onclick="setType(\''+k+'\')" aria-pressed="'+(p.type===k)+'"><strong>'+n+'</strong><small>'+k+'</small></button>').join('')+'</div><p class="help">'+(p.typeEdited?'已使用你选择的服务类型。':'当前为矢量数据，默认选择矢量瓦片服务，可修改。')+'</p></div><div class="service-description compact-description">'+serviceArt(p.type)+'<div><strong>'+TYPES[p.type][0]+'</strong><p>'+TYPES[p.type][1]+'</p></div></div>'+options;
}
function fieldLabel(name){const f=publish.defs.find(d=>d.name===name);return f?.alias||name;}
function fieldPicker(key){
 const chosen=publish[key].fields;
 return '<details class="picker" id="fields"><summary><span>'+(chosen.length?chosen.map(f=>'<span class="chip">'+esc(fieldLabel(f))+'</span>').join(''):'请选择输出字段')+'</span></summary><div class="pick-pop"><div class="pick-tools"><label><input type="checkbox" '+(chosen.length===publish.defs.length?'checked ':'')+'onchange="allFields(\''+key+'\',this.checked)">全选</label><span class="muted">已选 '+chosen.length+' / '+publish.defs.length+' 项</span></div>'+publish.defs.map(f=>'<label><input type="checkbox" value="'+f.name+'" '+(chosen.includes(f.name)?'checked ':'')+'onchange="oneField(\''+key+'\',\''+f.name+'\',this.checked)"><span class="field-name">'+esc(f.alias||f.name)+(f.alias?'<small>'+esc(f.name)+'</small>':'')+'</span>'+(f.primaryKey?'<span class="key-tag">主键</span>':'')+'</label>').join('')+'</div></details>';
}
function paramsView(){
 return '<div class="param-heading"><h3>常用参数组合</h3><span class="muted" id="presetState">'+(PRESETS[publish.mvt.preset]?.name||'自定义')+'</span></div><div class="presets">'+Object.entries(PRESETS).map(([k,v])=>'<button class="preset'+(publish.mvt.preset===k?' selected':'')+'" data-preset="'+k+'" aria-pressed="'+(publish.mvt.preset===k)+'" onclick="applyPreset(\''+k+'\')"><strong>'+v.name+'</strong><span>'+v.desc+'</span></button>').join('')+'</div><div class="param-grid">'+PARAMS.map(([k,n])=>'<div class="param"><label><input type="checkbox" data-bind="mvt.params.'+k+'.enabled"'+(publish.mvt.params[k].enabled?' checked':'')+'>'+n+'</label>'+input('mvt.params.'+k+'.value','param-'+k,'请输入数值','number',(publish.mvt.params[k].enabled?'':'disabled')+' min="0" step="'+(k==='dropRate'?'any':'1')+'"')+'</div>').join('')+'</div><div class="checks" style="margin-bottom:17px">'+check('mvt.dropDense','自动丢弃最密集区域')+check('mvt.mergeDense','合并最密集区域的面要素')+check('mvt.cluster','对点进行聚类')+'</div><div class="error" id="error-params" role="alert">'+esc(publish.errors.params||'')+'</div>';
}
function applyPreset(k){
 saveFolds();const p=publish.mvt,v=PRESETS[k];p.params=freshParams();
 Object.entries(v.params).forEach(([key,value])=>p.params[key]={enabled:true,value});
 p.cluster=!!v.cluster;p.dropDense=false;p.mergeDense=false;p.preset=k;publish.opened.params=true;clearError('params');render();
}
function markCustom(){publish.mvt.preset='custom';if($('presetState'))$('presetState').textContent='自定义';document.querySelectorAll('[data-preset]').forEach(e=>{e.classList.remove('selected');e.setAttribute('aria-pressed','false');});const hint=document.querySelector('[data-fold=params]>summary .muted');if(hint)hint.textContent='自定义';}
function publishStep2(){
 const p=publish;
 return '<div class="selected-cover"><div class="art">'+(p.cover?'<img src="'+esc(p.cover)+'" alt="服务封面">':serviceArt(p.type))+'</div><div><strong>'+TYPES[p.type][0]+'</strong><span class="muted">'+p.type+'</span></div><div class="source">数据来源<span>'+DATA+'</span></div></div>'+
  field('name','服务名称',input('meta.name','name','填写便于识别的名称'),true,'1','内部标识由系统生成，只需填写这个用于展示的名称。')+
  '<div class="row">'+field('org','组织机构',select('meta.org','org',[ORG],'请选择组织机构'),true)+field('catalog','所在目录',select('meta.catalog','catalog',[CATALOG,'测试222'],'请选择目录'),true)+'</div>'+
  field('description','描述',area('meta.description','description','补充服务内容或用途'))+field('tags','标签',input('meta.tags','tags','输入标签'))+
  field('cover','服务封面',button(p.cover?'更换封面':'上传封面',"$('coverInput').click()",false,'type="button"')+(p.cover?button('恢复默认','resetCover()'):''))+
  fold('advanced','数据子集与输出设置',publishAdvanced(),'使用全部数据 · 可调整')+
  '<div class="system-id">服务标识 <code id="identifier">'+esc(p.meta.identifier)+'</code><span>系统生成</span></div>';
}
function publishAdvanced(){const p=publish;return field('geometry','几何类型','<div class="checks"><label><input type="checkbox" checked disabled>点</label><label class="muted"><input type="checkbox" disabled>线</label><label class="muted"><input type="checkbox" disabled>面</label></div>')+'<div class="row">'+field('outputCrs','输出坐标系',select('meta.crs','outputCrs',CRS.slice(0,3),'请选择坐标系'),true)+field('purpose','服务用途',select('meta.purpose','purpose',['业务','地图','综合']))+'</div>'+field('filter','属性过滤',input('meta.filter','filter','输入属性过滤条件'))+(['WMS','WFS'].includes(p.type)?field('subset','字段子集',input('meta.subset','subset','输入需要保留的字段')):'')+field('bbox','空间范围',input('meta.bbox','bbox','xmin, ymin, xmax, ymax'),false,'','不填写时使用全部数据范围。');}
function setType(type){saveFolds();publish.type=type;publish.typeEdited=true;publish.errors={};render();}
function pubBack(){saveFolds();publish.step=1;publish.errors={};render(true);}
function firstStep(){publish.step=1;publish.errors={};render(true);}
function publishExample(value){publish=pubInit(value);mode='publish';closed=false;render(true);}
function resetCover(){publish.cover='';render();}
function oneField(key,f,on){const list=publish[key].fields;publish[key].fields=on?[...new Set([...list,f])]:list.filter(x=>x!==f);refreshPicker(key);}
function allFields(key,on){publish[key].fields=on?publish.defs.map(f=>f.name):[];refreshPicker(key);}
function refreshPicker(key){clearError('fields');$('fields').outerHTML=fieldPicker(key);$('fields').open=true;}
function toggleGrid(g,on){publish.wmts.grids=on?[...new Set([...publish.wmts.grids,g])]:publish.wmts.grids.filter(x=>x!==g);clearError('wmtsGrid');}
function pubNext(){
 saveFolds();const p=publish,e={};
 if(p.type==='MVT'){

   note('2','已有信息继续沿用','','数据名称、组织和目录使用已有值，允许修改。','这是沿用已有能力，不计作新增功能。')+
   note('3','不再靠隐藏字段做减法','','描述、标签和封面直接保留。数据子集与输出参数仍可查看、调整。')+
   tryBox('查看前后差异','对照生产第二步，主要检查名称与原有业务字段。',button('查看生产截图',"openReference('step2')")+button('体验名称漏填','tryValidation()',false,'style="margin-top:8px"'));
 }else if(mode==='upload'){
  title=isRasterUpload()?'栅格入库增加一个可选项':'添加数据按原业务保留';
  body=note('1','三种途径、三个步骤保留','','上传文件 / 在线绘制 / 数据库导入；仍按创建方式、数据源、元数据完成。')+
   note('2','没有依据的字段不删','','名称、数据集、坐标系、组织、目录、标签和描述均保留；不把选填项整体藏起来。','数据集是否与目录重复，尚无独立业务核实结论，因此本次保留。')+
   note('3','栅格可跳过直方图','','选中 GeoTIFF 后可取消“解析像素直方图”，减少入库处理。','本原型只演示开关；是否能独立跳过、对渲染有无依赖，仍需后端确认。')+
   tryBox('不用准备文件也能体验','演示文件不会实际上传。',button('载入矢量示例',"exampleFile('vector')")+button('载入栅格示例',"exampleFile('raster')",false,'style="margin-top:8px"'))+
   '<p class="scope-note">名称带入、已有组织和目录沿用原型能力。普通非空间表格不要求坐标系；文件内容解析仍在入库后处理。</p>';
 }else{
  title='注册服务只做明确的小调整';
  body=note('1','两个“来源”说清楚','服务来源 / 地址来源容易混淆','“服务平台”区分 ArcGIS、GeoServer 等；“网络来源”区分内部与外部。')+
   note('2','类型名称与发布保持一致','','中文名称 + 协议缩写；地址、名称和原有业务字段完整保留。')+
   note('3','已知来源可带入','','选择互联网地图服务时，网络来源默认带为外部互联网；用户手改后不覆盖。')+
   tryBox('试一次完整注册','来源与协议仍可手动选择。只校验地址格式，不假装探测服务。',button('填入注册示例','registerExample()')+button('查看生产截图',"openReference('register')",false,'style="margin-top:8px"'))+
   '<p class="scope-note">本次未新增远程能力解析、在线探测、共享或调用统计。</p>';
 }
 $('notes').innerHTML='<div class="notes-head"><small>本期调整 · 评审说明</small><h2>'+title+'</h2></div><div class="notes-body">'+body+'</div><div class="notes-foot">说明区与示例切换不属于业务页面。此文件为本地演示，不连接生产服务。详情页维持现状。</div>';

function renderReference(){const screens=JSON.parse($('screens').textContent);$('refImage').src=screens[$('refSelect').value];$('refImage').alt=$('refSelect').selectedOptions[0].textContent+' · 生产环境原始截图';}
function toggleRefSize(button){const actual=$('refBody').classList.toggle('actual');button.textContent=actual?'适应窗口':'按原尺寸查看';}
document.addEventListener('click',e=>{document.querySelectorAll('.picker[open]').forEach(p=>{if(!p.contains(e.target))p.open=false;});});
render(true);
