      <nav id="topNav" class="flex items-center h-16 gap-0.5">

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M4.9 4.9a15 15 0 0 1 0 14.2"/><path d="M7.8 7.8a10 10 0 0 1 0 8.4"/><circle cx="12" cy="12" r="1.6"/><path d="M16.2 7.8a10 10 0 0 1 2.8 6.4"/><path d="M19.1 4.9a15 15 0 0 1 0 14.2"/></svg> 地图服务

        <a href="要素图层.html" data-module="layer" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 要素图层
        </a>
        <a href="专题地图.html" data-module="map" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg> 专题地图
        </a>
        <a href="任务中心.html" data-module="task" class="nav-btn px-3.5 h-16 text-gray-600 hover:text-brand-hover relative font-medium transition-colors text-sm flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg> 任务中心
        </a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <button id="emptyToggleBtn" onclick="toggleEmptyState()" class="text-gray-400 hover:text-orange-500 text-xs flex items-center gap-1 transition-colors" title="切换当前模块空状态 / 有数据，用于验证空状态引导设计"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> 空状态</button>
      <div class="w-8 h-8 rounded-full bg-[#f56a00] text-white flex items-center justify-center font-semibold text-sm">张</div>
      <span class="text-gray-700 text-sm">张建国</span>
      <span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded">业务人员</span>

  <!-- BODY -->
  <div class="flex flex-1 overflow-hidden">
    <!-- SIDEBAR -->

<!-- ============================================================ -->
<!-- MODALS & OVERLAYS（模块专属；detailModal / moveModal / 通知 / 地图查看器由 common.js 注入） -->
<!-- ============================================================ -->

<!-- LAYER CREATION WIZARD (aligned with S-16 要素图层新增地图) -->
<div id="layerWizard" class="fixed inset-0 z-50 hidden flex items-center justify-center" style="background: rgba(0,0,0,.45);">
  <div class="bg-white rounded-2xl shadow-2xl overflow-hidden fade-in" style="width: 720px; max-height: 90vh; display: flex; flex-direction: column;">
    <div class="px-6 py-4 border-b border-line flex items-center justify-between shrink-0">
      <h2 class="text-base font-semibold text-gray-900" id="lwTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 创建要素图层</h2>
      <button onclick="closeWizard('layerWizard')" class="text-gray-400 hover:text-gray-600 text-lg leading-none">✕</button>
    </div>
    <div class="p-6 space-y-4 overflow-y-auto scroll-thin flex-1">
      <!-- Row 1: 图层名称 + 图层编码 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">图层名称 <span class="text-red-400">*</span></label>
          <input type="text" id="lwName" placeholder="例如：XX农场耕地监测图层" value="XX农场耕地监测要素图层" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand/20">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">图层编码 <span class="text-red-400">*</span></label>
          <input type="text" id="lwCode" placeholder="系统自动生成，可留空" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm bg-gray-50 text-gray-500 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand/20">
        </div>
      </div>
      <!-- Row 2: 坐标系(自动推导) + 组织机构 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">坐标系 <span class="text-[11px] text-gray-400 font-normal">（自动推导）</span></label>
          <div id="lwCrsDisplay" class="flex items-center gap-2 px-3 py-2.5 border border-line rounded-lg bg-gray-50 text-sm transition-colors">
            <span id="lwCrsIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg></span>
            <span id="lwCrsText" class="text-gray-500">选择服务后自动确定</span>
          </div>
          <p class="text-[11px] text-gray-400 mt-1">由已选服务的坐标系自动推导，不允许混用不同坐标系</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">组织机构 <span class="text-red-400">*</span></label>
          <select id="lwOrg" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
            <option>北大荒农垦集团有限公司</option>
            <option>八五六农场</option>
            <option>鹤山农场</option>
            <option>竞山农场</option>
            <option>二龙山农场</option>
          </select>
        </div>
      </div>
      <!-- Row 3: 图层类型 + 渲染引擎 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">图层类型 <span class="text-red-400">*</span></label>
          <div id="lwTypeWrap" class="flex flex-wrap items-center gap-1.5 px-3 py-2 border border-line rounded-lg bg-white min-h-[42px] cursor-pointer focus-within:border-brand focus-within:ring-1 focus-within:ring-brand/20" onclick="document.getElementById('lwTypeSelect').focus()">
            <span id="lwTypeTag" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-brand-light text-brand">矢量图层 <button onclick="event.stopPropagation();removeLwTypeTag()" class="text-brand hover:text-brand-dark ml-0.5">&times;</button></span>
            <select id="lwTypeSelect" class="flex-1 border-0 bg-transparent text-sm focus:outline-none min-w-[80px]" onchange="addLwTypeTag(this.value);this.value=''">
              <option value="" disabled selected>+ 添加类型</option>
              <option>矢量图层</option>
              <option>栅格图层</option>
              <option>三维图层</option>
              <option>聚合图层</option>
              <option>热力图层</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">渲染引擎 <span class="text-red-400">*</span></label>
          <select id="lwEngine" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand">
            <option>二维（2D）</option>
            <option>三维（3D）</option>
          </select>
        </div>
      </div>
      <!-- Row 4: 标签 + 图标 -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">地图标签</label>
          <div class="flex items-center gap-1.5">
            <select id="lwTagSelect" class="flex-1 px-3 py-2.5 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand" onchange="addLwTag(this.value);this.value=''">
              <option value="" selected>选择标签...</option>
              <option>耕地监测</option>
              <option>水利</option>
              <option>遥感</option>
              <option>行政</option>
              <option>驾驶舱</option>
              <option>长势</option>
              <option>测试</option>
            </select>
          </div>
          <div id="lwTags" class="flex flex-wrap gap-1.5 mt-2"></div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">地图图标</label>
          <div class="flex items-center gap-2">
            <div class="flex items-center gap-2 px-3 py-2.5 border border-line rounded-lg bg-gray-50 flex-1 cursor-pointer" onclick="cycleLwIcon()">
              <span id="lwIconDisplay" class="text-xl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg></span>
              <span id="lwIconLabel" class="text-xs text-gray-400">默认图标，点击切换</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Service selection (tree structure) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">选择地图服务 <span class="text-red-400">*</span></label>
        <div class="border border-line rounded-lg overflow-hidden">
          <div class="p-3 bg-gray-50 border-b border-line">
            <div class="relative flex items-center">
            <span class="absolute left-3 text-gray-400 pointer-events-none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
            <input type="text" placeholder="搜索已发布的服务..." class="w-full pl-8 pr-3 py-1.5 border border-line rounded-lg text-sm bg-white focus:outline-none focus:border-brand" oninput="filterLayerServiceTree(this.value)">
          </div>
          </div>
          <div id="lwServiceTree" class="max-h-56 overflow-y-auto scroll-thin p-2"></div>
        </div>
        <div class="mt-2 flex items-center gap-2">
          <span class="text-xs text-gray-500">已选：<strong id="lwSvcCount" class="text-brand">0</strong> 个服务</span>
          <span id="lwSvcHint" class="text-xs text-orange-500 hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg> 请至少选择 1 个服务</span>
        </div>
      </div>
      <!-- Preview button -->
      <div class="flex items-center gap-3">
        <button onclick="openLayerPreview()" class="px-4 py-2.5 border border-brand text-brand hover:bg-brand-light rounded text-sm font-medium transition-colors flex items-center gap-1.5">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> 预览服务叠加效果
        </button>
        <span class="text-xs text-gray-400">点击预览已选服务在地图上的叠加效果</span>
      </div>
      <!-- 描述 -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">描述 <span class="text-gray-400 text-xs font-normal">（选填）</span></label>
        <textarea id="lwDesc" rows="2" placeholder="简单描述这个要素图层的用途，方便同事查找和使用" class="w-full px-3 py-2.5 border border-line rounded-lg text-sm focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand/20 resize-none"></textarea>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-line flex items-center justify-between bg-gray-50 shrink-0">
      <span class="text-xs text-gray-400">带 <span class="text-red-400">*</span> 为必填项</span>
      <div class="flex items-center gap-3">
        <button onclick="closeWizard('layerWizard')" class="px-4 py-1.5 text-gray-500 hover:text-gray-700 text-sm transition-colors">取消</button>
        <button onclick="confirmLayer()" class="px-4 py-1.5 bg-brand hover:bg-brand-hover text-white rounded text-sm font-medium transition-colors">确认创建</button>
      </div>
    </div>
  </div>
</div>

<!-- LAYER PREVIEW POPUP -->
<div id="layerPreviewPopup" class="fixed inset-0 z-[60] hidden flex items-center justify-center" style="background: rgba(0,0,0,.5);">
  <div class="bg-white rounded-2xl shadow-2xl overflow-hidden scale-in" style="width: 820px;">
    <div class="px-6 py-4 border-b border-line flex items-center justify-between">
      <div>
        <h3 class="text-base font-semibold text-gray-900"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg> 服务叠加预览</h3>
        <p id="lpvSubtitle" class="text-xs text-gray-500 mt-0.5">已选 0 个服务</p>
      </div>
      <button onclick="closeLayerPreview()" class="text-gray-400 hover:text-gray-600 text-lg leading-none">✕</button>
    </div>
    <div class="relative">
      <div id="lpvMapArea" class="h-80 flex items-center justify-center text-gray-400 text-sm relative" style="background: linear-gradient(135deg, #e8f4f8 0%, #d4e8f0 30%, #c8dce8 60%, #b8d4e0 100%);">
        <div class="text-center z-10">
          <div class="text-5xl mb-3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg></div>
          <div class="text-sm font-medium text-gray-600 mb-1">已选服务叠加预览</div>
          <div class="text-xs text-gray-500" id="lpvServiceList">尚未选择任何服务</div>
        </div>
        <!-- Fake map grid -->
        <div class="absolute inset-0 opacity-10" style="background-image: repeating-linear-gradient(0deg, #1cd6b4, #1cd6b4 1px, transparent 1px, transparent 40px), repeating-linear-gradient(90deg, #1cd6b4, #1cd6b4 1px, transparent 1px, transparent 40px);"></div>
        <!-- Fake annotation markers -->
        <div id="lpvMarkers" class="absolute inset-0 z-20"></div>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-line flex items-center justify-between bg-gray-50">
      <span class="text-xs text-gray-400"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg> 此预览仅为服务叠加示意，实际渲染效果以地图设计页为准</span>
      <button onclick="closeLayerPreview()" class="px-4 py-1.5 bg-brand hover:bg-brand-hover text-white rounded text-sm font-medium transition-colors">关闭预览</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
// ── 要素图层：确认创建 ─────────────────────────────────
function confirmLayer() {
  const name = (document.getElementById('lwName').value || '').trim();
  const code = (document.getElementById('lwCode').value || '').trim();
  if (!name) {
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '请先填写图层名称');
    return;
  }
  if (!code) {
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '请先填写图层编码');
    return;
  }
  const checked = getLwSelectedServices();
  if (checked.length === 0) {
    document.getElementById('lwSvcHint').classList.remove('hidden');
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '请至少选择一个地图服务');
    return;
  }
  document.getElementById('lwSvcHint').classList.add('hidden');
  closeWizard('layerWizard');
  if (!notified.layer) {
    notified.layer = true;
    showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>', '图层组合「' + name + '」创建成功！下一步：用它生成一张<strong>专题地图</strong>（一张图/大屏）。<button onclick="openEditorPrototype()" class="text-brand underline font-medium ml-2">创建专题地图 →</button>');
  }
}

// ── 要素图层创建：服务树 ────────────────────────────────
let lwSelectedServices = {};
let lwServiceTreeData = [];

function buildLayerServiceTreeData() {
  // Build tree from moduleConfigs.service.cards, mirroring the service sidebar
  const cards = moduleConfigs.service.cards;
  const mapServices = cards.filter(c => c.layerCategory === 'map');
  const dataServices = cards.filter(c => c.layerCategory === 'data');

  // Group by cat within each layerCategory
  function groupByCat(list) {
    const groups = {};
    list.forEach(c => {
      const cat = c.cat || '其他';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(c);
    });
    return groups;
  }

  const mapGroups = groupByCat(mapServices);
  const dataGroups = groupByCat(dataServices);

  const tree = [
    {
      name: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg> 地图图层（底图/展示）',
      id: 'lw_map',
      open: true,
      children: Object.keys(mapGroups).map(cat => ({
        name: catLabel(cat),
        id: 'lw_map_' + cat,
        open: true,
        services: mapGroups[cat]
      }))
    },
    {
      name: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> 数据图层（查询/分析）',
      id: 'lw_dt',
      open: true,
      children: Object.keys(dataGroups).map(cat => ({
        name: catLabel(cat),
        id: 'lw_dt_' + cat,
        open: true,
        services: dataGroups[cat]
      }))
    }
  ];
  return tree;

  function catLabel(cat) {
    const map = { '遥感': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg> 遥感影像', '外部': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg> 在线底图', '耕地': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg> 耕地业务', '底图': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg> 行政区划' };
    return map[cat] || ('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2"/></svg> ' + cat);
  }
}

function renderLayerServiceTree(filterText) {
  lwServiceTreeData = buildLayerServiceTreeData();
  const container = document.getElementById('lwServiceTree');
  if (!container) return;
  let html = '';
  function renderNodes(nodes, level) {
    nodes.forEach(node => {
      if (node.children) {
        // Category node with expand/collapse
        const isOpen = typeof node.open !== 'undefined' ? node.open : true;
        html += '<div class="lw-tree-cat" style="padding-left:' + (level * 24) + 'px">';
        html += '<div class="flex items-center gap-1.5 py-1.5 px-2 rounded-lg hover:bg-gray-50 cursor-pointer text-sm font-medium text-gray-700" onclick="toggleLwTreeNode(this, \'' + node.id + '\')">';
        html += '<span class="text-[10px] w-3 text-center transition-transform lw-arrow' + (isOpen ? ' rotate-90' : '') + '">▶</span>';
        html += '<span>' + node.name + '</span>';
        html += '</div>';
        html += '<div class="lw-tree-children' + (isOpen ? '' : ' hidden') + '">';
        renderNodes(node.children, level + 1);
        html += '</div>';
        html += '</div>';
      } else if (node.services) {
        // Leaf node with service checkboxes
        html += '<div class="lw-tree-leaf" style="padding-left:' + (level * 24) + 'px">';
        html += '<div class="flex items-center gap-1.5 py-1 px-2 rounded-lg hover:bg-gray-50 cursor-pointer text-xs font-medium text-gray-600" onclick="toggleLwTreeNode(this, \'' + node.id + '\')">';
        html += '<span class="text-[10px] w-3 text-center transition-transform lw-arrow' + (node.open !== false ? ' rotate-90' : '') + '">▶</span>';
        html += '<span>' + node.name + ' <span class="text-gray-400 font-normal">(' + node.services.length + ')</span></span>';
        html += '</div>';
        html += '<div class="lw-tree-children' + (node.open !== false ? '' : ' hidden') + '">';
        node.services.forEach(svc => {
          const checked = lwSelectedServices[svc.title] ? 'checked' : '';
          const match = !filterText || svc.title.includes(filterText) || (svc.type || '').includes(filterText) || (svc.cat || '').includes(filterText);
          html += '<label class="flex items-center gap-2 py-1.5 px-2 hover:bg-gray-50 cursor-pointer text-sm' + (match ? '' : ' hidden') + '" style="padding-left:24px">';
          html += '<input type="checkbox" ' + checked + ' onchange="toggleLwService(this, \'' + svc.title.replace(/'/g, "\\'") + '\')" class="rounded border-gray-300 text-brand focus:ring-brand/30">';
          html += '<span class="flex-1 text-gray-800 truncate">' + svc.title + '</span>';
          html += '<span class="text-[10px] text-gray-400 shrink-0">' + (svc.type || '') + '</span>';
          html += '<span class="text-[10px] shrink-0 ml-1 px-1 rounded ' + (svc.crs === '中国大地坐标' ? 'bg-orange-50 text-orange-600' : 'bg-brand-light text-brand') + '">' + (svc.crs || '') + '</span>';
          html += '</label>';
        });
        html += '</div>';
        html += '</div>';
      }
    });
  }
  renderNodes(lwServiceTreeData, 0);
  container.innerHTML = html;
  updateLwSelectedCount();
}

function toggleLwTreeNode(el, nodeId) {
  const children = el.parentElement.querySelector('.lw-tree-children');
  const arrow = el.querySelector('.lw-arrow');
  if (children) {
    children.classList.toggle('hidden');
    if (arrow) arrow.classList.toggle('rotate-90');
  }
}

function toggleLwService(cb, title) {
  if (cb.checked) {
    // Check CRS compatibility
    const allCards = moduleConfigs.service.cards;
    const thisCard = allCards.find(c => c.title === title);
    const thisCrs = thisCard ? (thisCard.crs || '未知') : '未知';
    const selected = getLwSelectedServices();
    if (selected.length > 0) {
      const firstTitle = selected[0];
      const firstCard = allCards.find(c => c.title === firstTitle);
      const activeCrs = firstCard ? (firstCard.crs || '未知') : '未知';
      if (thisCrs !== activeCrs) {
        cb.checked = false;
        showNotification('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>', '不允许混用不同坐标系的服务：已选「<strong>' + activeCrs + '</strong>」，而「' + title + '」的坐标系是「<strong>' + thisCrs + '</strong>」');
        return;
      }
    }
    lwSelectedServices[title] = true;
  } else {
    delete lwSelectedServices[title];
  }
  updateLwSelectedCount();
  updateLwCrsDisplay();
}

function getLwSelectedServices() {
  return Object.keys(lwSelectedServices).filter(k => lwSelectedServices[k]);
}

function updateLwSelectedCount() {
  const count = getLwSelectedServices().length;
  const el = document.getElementById('lwSvcCount');
  const hint = document.getElementById('lwSvcHint');
  if (el) el.textContent = count;
  if (hint) {
    if (count === 0) hint.classList.remove('hidden');
    else hint.classList.add('hidden');
  }
  updateLwCrsDisplay();
}

function updateLwCrsDisplay() {
  const selected = getLwSelectedServices();
  const icon = document.getElementById('lwCrsIcon');
  const text = document.getElementById('lwCrsText');
  const display = document.getElementById('lwCrsDisplay');
  if (!text || !display) return;
  if (selected.length === 0) {
    if (icon) { icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg>'; icon.className = 'text-gray-400'; }
    text.textContent = '选择服务后自动确定';
    text.className = 'text-gray-500';
    display.className = display.className.replace(' border-green-300 bg-green-50', '');
    if (!display.className.includes(' bg-gray-50')) display.className += ' bg-gray-50';
  } else {
    const allCards = moduleConfigs.service.cards;
    const firstCard = allCards.find(c => c.title === selected[0]);
    const crs = firstCard ? (firstCard.crs || '未知') : '未知';
    const sameCount = selected.filter(t => {
      const c = allCards.find(x => x.title === t);
      return c && (c.crs || '未知') === crs;
    }).length;
    if (icon) { icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'; icon.className = 'text-brand'; }
    text.textContent = crs + '（' + sameCount + ' 个服务统一）';
    text.className = 'text-brand font-medium text-sm';
    display.className = display.className.replace(' bg-gray-50', '').replace(' border-line', ' border-green-300 bg-green-50');
  }
}

function filterLayerServiceTree(text) {
  renderLayerServiceTree(text.trim());
}

// Auto-init service tree when wizard opens
(function() {
  const origOpen = document.getElementById('layerWizard');
  if (origOpen) {
    // Hook into the wizard opening via MutationObserver on class
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
          if (!document.getElementById('layerWizard').classList.contains('hidden')) {
            renderLayerServiceTree();
          }
        }
      });
    });
    observer.observe(origOpen, { attributes: true });
  }
})();

// ── 图层标签管理 ──────────────────────────────────────
let lwTags = [];

function addLwTag(val) {
  if (!val || lwTags.includes(val)) return;
  lwTags.push(val);
  renderLwTags();
}

function removeLwTag(idx) {
  lwTags.splice(idx, 1);
  renderLwTags();
}

function renderLwTags() {
  const container = document.getElementById('lwTags');
  if (!container) return;
  container.innerHTML = lwTags.map((t, i) =>
    '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-brand-light text-brand">' +
    t + ' <button onclick="removeLwTag(' + i + ')" class="text-brand hover:text-brand-dark">&times;</button></span>'
  ).join('');
}

// ── 图层类型标签 ──────────────────────────────────────
let lwTypeTags = ['矢量图层'];

function addLwTypeTag(val) {
  if (!val || lwTypeTags.length >= 3) return;
  lwTypeTags.push(val);
  renderLwTypeTags();
}

function removeLwTypeTag(idx) {
  if (lwTypeTags.length <= 1) return;
  if (typeof idx === 'number') lwTypeTags.splice(idx, 1);
  else lwTypeTags.pop();
  renderLwTypeTags();
}

function renderLwTypeTags() {
  const wrap = document.getElementById('lwTypeWrap');
  const select = document.getElementById('lwTypeSelect');
  if (!wrap || !select) return;
  let tagsHtml = lwTypeTags.map((t, i) =>
    '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-brand-light text-brand">' +
    t + ' <button onclick="event.stopPropagation();removeLwTypeTag(' + i + ')" class="text-brand hover:text-brand-dark ml-0.5">&times;</button></span>'
  ).join('');
  // Insert tags before the select
  const existing = wrap.querySelectorAll('.lw-type-tag');
  existing.forEach(e => e.remove());
  const tagContainer = document.createElement('span');
  tagContainer.innerHTML = tagsHtml;
  tagContainer.className = 'lw-type-tag-contents';
  wrap.insertBefore(tagContainer, select);
}

// ── 图标切换 ───────────────────────────────────────────
const lwIcons = ['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/><path d="M2 12h20"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M13 7 9 3 5 7l4 4"/><path d="m17 11 4 4-4 4-4-4"/><path d="m8 12 4 4 6-6-4-4Z"/><path d="m16 8 3-3"/><path d="M9 21a6 6 0 0 0-6-6"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'];
let lwIconIdx = 0;

function cycleLwIcon() {
  lwIconIdx = (lwIconIdx + 1) % lwIcons.length;
  const display = document.getElementById('lwIconDisplay');
  const label = document.getElementById('lwIconLabel');
  if (display) display.innerHTML = lwIcons[lwIconIdx];
  if (label) label.textContent = lwIconIdx === 0 ? '默认图标，点击切换' : '已选择图标';
}

// ── 预览弹窗 ───────────────────────────────────────────
function openLayerPreview() {
  const selected = getLwSelectedServices();
  const popup = document.getElementById('layerPreviewPopup');
  const subtitle = document.getElementById('lpvSubtitle');
  const list = document.getElementById('lpvServiceList');
  const markers = document.getElementById('lpvMarkers');

  if (!popup) return;

  if (subtitle) subtitle.textContent = '已选 ' + selected.length + ' 个服务';
  if (list) {
    if (selected.length === 0) {
      list.textContent = '尚未选择任何服务';
    } else {
      list.innerHTML = selected.map(s => '<span class="inline-block px-2 py-0.5 bg-white/70 rounded text-xs text-gray-700 m-0.5 shadow-sm">' + s + '</span>').join('');
    }
  }

  // Generate fake markers for selected services
  if (markers) {
    if (selected.length > 0) {
      const positions = [
        { top: '25%', left: '30%' }, { top: '40%', left: '55%' }, { top: '60%', left: '25%' },
        { top: '20%', left: '65%' }, { top: '55%', left: '70%' }, { top: '35%', left: '45%' },
      ];
      markers.innerHTML = selected.map((s, i) => {
        const pos = positions[i % positions.length];
        return '<div class="absolute flex flex-col items-center" style="top:' + pos.top + ';left:' + pos.left + ';transform:translate(-50%,-50%)">' +
          '<div class="w-4 h-4 rounded-full bg-brand shadow-md border-2 border-white animate-pulse"></div>' +
          '<div class="mt-1 px-1.5 py-0.5 bg-white/90 rounded text-[10px] text-gray-700 shadow-sm whitespace-nowrap max-w-[120px] truncate">' + s + '</div>' +
          '</div>';
      }).join('');
    } else {
      markers.innerHTML = '';
    }
  }

  popup.classList.remove('hidden');
}

function closeLayerPreview() {
  const popup = document.getElementById('layerPreviewPopup');
  if (popup) popup.classList.add('hidden');
}

// Reset layer wizard state when opened
function resetLayerWizard() {
  lwSelectedServices = {};
  lwTags = [];
  lwTypeTags = ['矢量图层'];
  lwIconIdx = 0;
  const nameInput = document.getElementById('lwName');
  const codeInput = document.getElementById('lwCode');
  const descInput = document.getElementById('lwDesc');
  const iconDisplay = document.getElementById('lwIconDisplay');
  const iconLabel = document.getElementById('lwIconLabel');
  if (nameInput) nameInput.value = 'XX农场耕地监测要素图层';
  if (codeInput) codeInput.value = '';
  if (descInput) descInput.value = '';
  if (iconDisplay) iconDisplay.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15.061"/><path d="M9 3.236v15.062"/></svg>';
  if (iconLabel) iconLabel.textContent = '默认图标，点击切换';
  document.getElementById('lwTitle').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 创建要素图层';
  renderLwTags();
  renderLwTypeTags();
  renderLayerServiceTree();
  updateLwSelectedCount();
  updateLwCrsDisplay();
  document.getElementById('lwSvcHint').classList.add('hidden');
}

// ── 要素图层：编辑 / 设计 ──────────────────────────────
function openLayerDesign(action, title) {
  if (action === 'edit') {
    document.getElementById('lwTitle').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.125em;flex-shrink:0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg> 编辑要素图层';
    const nameInput = document.getElementById('lwName');
    if (nameInput) nameInput.value = title;
    document.getElementById('layerWizard').classList.remove('hidden');
    renderLayerServiceTree();
  } else {
    openMapViewer(title); // 设计 = 打开图层叠加预览
  }
}

// ── 初始化 ─────────────────────────────────────────────
document.getElementById('appShell').classList.remove('hidden');
activeModule = 'layer';
switchModule('layer');
showWelcomeIfNeeded();
</script>
